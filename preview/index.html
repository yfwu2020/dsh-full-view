<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整视图插件验证 — DeepSeek Harness</title>
<style>
:root { --dsw-alias-label-tertiary:#8b8b93; --dsw-alias-state-success-primary:#22a06b; --dsw-alias-state-warn-primary:#cf8a11; --dsw-alias-state-idle-primary:#9999a1; }
:root { --dsw-alias-bg-base:#fff; --dsw-alias-label-primary:#232326; --dsw-alias-label-secondary:#717177; --dsw-alias-border-l3:#e4e4e8; --dsw-alias-interactive-bg-hover:#efeff2; }
* { box-sizing:border-box } body { margin:0; color:#232326; font:14px/1.6 system-ui,sans-serif } button { cursor:pointer; font:inherit } #frame { height:100vh; display:grid; grid-template-columns:220px minmax(0,1fr) 42%; grid-template-rows:100%; position:relative; overflow:hidden; background:#fff } [data-shell-overlay] { position:absolute; inset:0; pointer-events:none }
#nav { padding:28px 20px; background:#f4f4f7; border-right:1px solid #e4e4e8 } #nav strong { font-size:18px } #nav p { margin-top:28px; color:#777 } #nav button { border:0; background:#e7e8ee; border-radius:6px; text-align:left; padding:10px; width:100%; margin-bottom:8px }
[data-slot="main"] { display:contents; }
#chat { min-width:0; display:flex; flex-direction:column; overflow:hidden } #root { height:100%; min-height:0; display:flex; flex-direction:column } #root header { padding:18px 24px; border-bottom:1px solid #eee }
[data-conversation-content] { flex:1; min-height:0; display:flex; flex-direction:column } #messages { flex:1; min-height:0; overflow:auto; padding:20px; } #messages p { padding:12px; border-radius:8px; background:#f5f5f8 } #composer { flex:none; padding:12px; border-top:1px solid #eee } textarea { display:block; width:100%; min-height:72px; border:1px solid #ddd; border-radius:9px; padding:10px; font:inherit; resize:none } #composer button { margin-top:8px; border:0; border-radius:6px; padding:6px 16px; background:#517bdf; color:#fff }
[data-rightbar-col] { position:relative; min-width:0 } [data-sidebar-right-panel] { position:absolute; top:0; right:0; bottom:0; width:100%; display:flex; flex-direction:column; background:#fafafb; z-index:40; border-left:1px solid #e4e4e8 } [data-sidebar-right-panel="fullscreen"] { width:100vw } .tabbar { padding:14px 20px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #e4e4e8; background:#fff; } .tabbar span { flex:1 } .tabbar button { border:1px solid #ddd; background:transparent; padding:4px 8px; border-radius:6px } iframe { border:0; width:100%; flex:1; min-height:0 } #status { position:absolute; bottom:12px; left:16px; z-index:70; background:#fff; border:1px solid #ddd; border-radius:6px; padding:4px 8px; font-size:11px; max-width:190px }
[data-conversation-scroll] { flex:1; min-height:0; display:flex; flex-direction:column; overflow:auto; }
#composer { padding:0; border:0; }
.composer-stack { padding-bottom:16px; }
.input-root { padding:0 8px 4px; display:flex; flex-direction:column; align-items:center; }
[data-composer-card] { width:100%; max-width:var(--dsh-composer-card-max-width); display:flex; flex-direction:column; gap:12px; padding-top:8px; background:#fff; border-radius:18px; box-shadow:0 0 0 1px #ddd,0 2px 10px #0001; }
[data-input-scroll] { max-height:160px; overflow-y:auto; }
.input-grow { position:relative; }
[data-composer-input] { min-height:36px; padding:4px 8px 0 14px; outline:none; line-height:24px; white-space:pre-wrap; overflow-wrap:anywhere; }
[data-composer-placeholder] { position:absolute; inset:4px 8px auto 14px; color:#999; pointer-events:none; }
[data-composer-placeholder][hidden] { display:none; }
.input-footer { text-align:center; color:#999; font-size:12px; padding-top:4px; }
.input-row { container-type:inline-size; min-width:0; gap:12px; flex-wrap:wrap; display:flex; justify-content:space-between; padding:2px 8px 6px; }
.input-tools,.input-trailing { min-width:0; display:flex; align-items:center; gap:12px; }
#composer button { display:grid; place-items:center; width:28px; height:28px; margin:0; padding:0; color:var(--dsw-alias-label-secondary); background:transparent; border:0; border-radius:50%; }
#composer #send { width:32px; height:32px; color:white; background:#3b82f6; transform:translateY(-2px); }

body.dark { color: #e9e9ed; --dsw-alias-bg-base: #202024; --dsw-alias-label-primary: #e9e9ed; --dsw-alias-label-secondary: #a0a0a8; --dsw-alias-border-l3: #404046; --dsw-alias-interactive-bg-hover: #36363d; }
body.dark #frame, body.dark .tabbar, body.dark #nav, body.dark [data-composer-card], body.dark #status { background: #202024; color: #e9e9ed; }
body.dark .tabbar button { color: #e9e9ed; }
body.dark #nav button, body.dark #messages p { background: #35353b; color: #e9e9ed; }
.demo-menu { position: fixed; z-index: 90; right: 32px; bottom: 106px; background: var(--dsw-alias-bg-base); border: 1px solid var(--dsw-alias-border-l3); padding: 16px; border-radius: 12px; }
#composer .demo-pending button { width: auto; height: 32px; padding: 0 12px; border-radius: 8px; background: #3b82f6; color: #fff; }
.demo-pending { background: var(--dsw-alias-bg-base); border: 1px solid var(--dsw-alias-border-l3); padding: 20px; border-radius: 14px; }
.demo-attachments { min-width:0; padding:4px 4px 0; }
.demo-attachment-list { display:flex; gap:8px; overflow-x:auto; padding:2px; }
.demo-attachment-card { display:flex; align-items:center; gap:8px; min-width:150px; height:52px; flex:none; border:1px solid var(--dsw-alias-border-l3); border-radius:10px; padding:6px 8px; color:var(--dsw-alias-label-primary); }
.demo-attachment-kind { display:grid; place-items:center; width:32px; height:36px; background:var(--dsw-alias-interactive-bg-hover); border-radius:6px; color:var(--dsw-alias-label-secondary); font-size:10px; }
.demo-attachment-name { font-size:12px; white-space:nowrap; }
#composer .demo-attachment-remove { width:20px; height:20px; font-size:16px; margin-left:auto; }
</style></head><body>
<div id="frame"><aside id="nav"><strong>DeepSeek Harness</strong><p>插件交互验证</p><button id="enter">进入完整视图</button><button id="exit">返回分栏</button><button id="stream">追加流式回复</button><button id="run">开始模拟运行</button><button id="pending">模拟待办提示</button><button id="theme">切换深浅主题</button><button id="unload">卸载插件</button><p>此页使用插件发布的客户端文件。输入草稿后反复切换，检查内容是否保留。</p></aside>
<main id="chat"><div data-slot="main"><div id="root"><header><div data-conversation-header-leading>完整视图插件验证</div></header><div data-conversation-content data-conversation-session="fixture"><div data-conversation-scroll><div id="messages" data-conversation-region="messages"><p>把工作内容展开，我继续在聊天小窗里和你协作。</p><p>聊天、输入框和网页都是原来的实例。点击小窗外缘可以收起成输入条。</p></div><div id="composer" data-composer-seat><div class="composer-stack"><div class="input-root"><div data-composer-card><div data-input-scroll><div class="input-grow"><div data-composer-input contenteditable="true" role="textbox" aria-label="聊天草稿" id="draft"></div><div data-composer-placeholder>输入消息</div></div></div><div class="input-row"><div class="input-tools"><button id="add" aria-label="附件" title="附件（演示）"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v16M4 12h16"/></svg></button><button id="permission" aria-label="权限" title="权限（演示）"><span aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6zM12 7v6m0 3v1"/></svg></span><span>完全权限</span></button></div><div class="input-trailing"><button id="model" aria-label="模型" title="模型（演示）"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3a4 4 0 0 0-4 4 4 4 0 0 0-2 7 4 4 0 0 0 6 6V3zm6 0a4 4 0 0 1 4 4 4 4 0 0 1 2 7 4 4 0 0 1-6 6V3z"/></svg></button><button id="send" aria-label="发送测试消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div></div><div class="input-footer">用量统计 · 上下文 26%</div></div></div></div></div></div></div></div></main>
<div data-rightbar-col><div data-sidebar-right-session="fixture"><section data-sidebar-right-panel="push" data-sidebar-right-open><div class="tabbar"><span>网页预览</span><button data-sidebar-right-mode="fullscreen">进入完整视图</button></div><iframe id="preview" title="状态保持验证网页" srcdoc="<!doctype html><html lang='zh-CN'><body style='margin:0;padding:56px;font-family:system-ui;background:#fafafb;color:#25252a'><span style='font-size:12px;color:#888'>WORKSPACE / LIVE PREVIEW</span><h1 style='font-size:44px;font-weight:500;letter-spacing:-2px;margin:24px 0 12px'>把空间留给工作。</h1><p style='color:#777;font-size:17px'>展开预览，同时保留一扇可以继续对话的小窗。</p><input aria-label='网页表单' placeholder='输入内容，切换后应保留' style='padding:12px;width:280px;border:1px solid #ddd;border-radius:8px;margin-top:40px'><p id='loads'>网页加载次数：1</p></body></html>"></iframe></section></div></div><div data-shell-overlay></div><output id="status">分栏视图</output></div>
<script>
const frame=document.getElementById('frame'), panel=document.querySelector('[data-sidebar-right-panel]'), mode=document.querySelector('[data-sidebar-right-mode]');
function setMode(full){ frame.toggleAttribute('data-rightbar-fullscreen',full); panel.dataset.sidebarRightPanel=full?'fullscreen':'push'; mode.dataset.sidebarRightMode=full?'push':'fullscreen'; mode.textContent=full?'返回分栏视图':'进入完整视图'; }
document.getElementById('enter').onclick=()=>setMode(true); document.getElementById('exit').onclick=()=>setMode(false); mode.onclick=()=>setMode(!frame.hasAttribute('data-rightbar-fullscreen'));
document.getElementById('stream').onclick=()=>document.getElementById('messages').append(Object.assign(document.createElement('p'),{textContent:'流式回复追加，'+new Date().toLocaleTimeString()}));
document.getElementById('send').onclick=()=>{const draft=document.getElementById('draft');document.getElementById('messages').append(Object.assign(document.createElement('p'),{textContent:draft.textContent||'测试消息'}));draft.textContent='';document.querySelector('[data-composer-placeholder]').hidden=false};
document.getElementById('draft').oninput=()=>{document.querySelector('[data-composer-placeholder]').hidden=!!document.getElementById('draft').textContent};
let attachmentCount=0;
document.getElementById('add').onclick=()=>{
  const card=document.querySelector('[data-composer-card]');if(!card)return;
  let rail=card.querySelector('.demo-attachments');
  if(!rail){rail=document.createElement('div');rail.className='demo-attachments';const group=document.createElement('div');group.className='demo-attachment-list';group.setAttribute('role','group');group.setAttribute('aria-label','演示附件');rail.append(group);card.prepend(rail)}
  const image=++attachmentCount%2===0,name=image?'界面截图.png':'设计说明.txt';
  const item=document.createElement('div');item.className='demo-attachment-card';
  const icon=document.createElement('span');icon.className='demo-attachment-kind';icon.textContent=image?'PNG':'TXT';
  const title=document.createElement('span');title.className='demo-attachment-name';title.textContent=name;
  const remove=document.createElement('button');remove.className='demo-attachment-remove';remove.textContent='×';remove.setAttribute('aria-label','删除 '+name);remove.onclick=()=>{item.remove();if(!rail.querySelector('.demo-attachment-card'))rail.remove()};
  item.append(icon,title,remove);rail.querySelector('[role="group"]').append(item);
};
let nativeComposer;
document.getElementById('pending').onclick=()=>{
  if(document.querySelector('[data-approval-key]'))return;
  const seat=document.querySelector('[data-composer-seat]'); nativeComposer=[...seat.childNodes];
  const pending=document.createElement('section'); pending.className='demo-pending';pending.setAttribute('data-approval-key','demo');
  const text=document.createElement('p');text.textContent='演示待办：请确认是否继续（不会执行操作）';
  const close=document.createElement('button'); close.textContent='处理完成';close.onclick=()=>seat.replaceChildren(...nativeComposer);
  pending.append(text,close);seat.replaceChildren(pending);
};
document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');
for(const id of ['permission','model'])document.getElementById(id).onclick=()=>{
  document.querySelector('.demo-menu')?.remove();const menu=document.createElement('div');menu.className='demo-menu';menu.setAttribute('role','listbox');
  const close=document.createElement('button');close.textContent='关闭演示菜单';close.onclick=()=>menu.remove();menu.append(close);
  menu.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();menu.remove();document.getElementById(id).focus()}};
  document.body.append(menu);close.focus();
};
document.getElementById('unload').onclick=()=>{window.pluginCleanup?.();document.getElementById('status').textContent='插件已卸载'};
// This page uses explicit fake host stores; README screenshots come from real Harness.
function demoStore(value){const listeners=new Set();return {getSnapshot:()=>value,subscribe(fn){listeners.add(fn);return ()=>listeners.delete(fn)},set(next){value=next;for(const fn of listeners)fn()}}}
const sessionState=demoStore({running:false}),events=demoStore({entries:[]}),sessionStatus=demoStore(new Map([['fixture',{running:false}]]));
const demoServices={sessions:{list:demoStore({}),binding:id=>id==='fixture'?{session:sessionState,eventSource:events}:undefined},uiSession:{sessionStatus}};
let turn=0;
document.getElementById('run').onclick=()=>{
  const running=!sessionState.getSnapshot().running;
  if(running)turn++;
  events.set({entries:[...events.getSnapshot().entries,{event:{type:running?'turn/start':'turn/end',time:Date.now(),data:{turn}}}]});
  sessionState.set({running});sessionStatus.set(new Map([['fixture',{running}]]));
  document.getElementById('run').textContent=running?'结束模拟运行':'开始模拟运行';
};
window.__ModuleLoader__={load(registration){const module=registration.factory(()=>{throw new Error('unexpected external')});module.apply({get(name){return demoServices[name]},effect(factory){window.pluginCleanup=factory()}})}};
new MutationObserver(()=>{const full=frame.hasAttribute('data-dsh-full-view');document.getElementById('status').textContent=full?'完整视图 · 原聊天已浮起':'分栏视图'}).observe(frame,{attributes:true,attributeFilter:['data-dsh-full-view']});
</script><script src="/lib/client.js"></script></body></html>
