<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整视图插件验证 — DeepSeek Harness</title>
<style>
:root { --dsw-alias-bg-base:#fff; --dsw-alias-label-primary:#232326; --dsw-alias-label-secondary:#717177; --dsw-alias-border-l3:#e4e4e8; --dsw-alias-interactive-bg-hover:#efeff2; }
* { box-sizing:border-box } body { margin:0; color:#232326; font:14px/1.6 system-ui,sans-serif } button { cursor:pointer; font:inherit } #frame { height:100vh; display:grid; grid-template-columns:220px minmax(0,1fr) 42%; grid-template-rows:100%; position:relative; overflow:hidden; background:#fff } [data-shell-overlay] { position:absolute; inset:0; pointer-events:none }
#nav { padding:28px 20px; background:#f4f4f7; border-right:1px solid #e4e4e8 } #nav strong { font-size:18px } #nav p { margin-top:28px; color:#777 } #nav button { border:0; background:#e7e8ee; border-radius:6px; text-align:left; padding:10px; width:100%; margin-bottom:8px }
#chat { min-width:0; display:flex; flex-direction:column; overflow:hidden } #root { height:100%; min-height:0; display:flex; flex-direction:column } #root header { padding:18px 24px; border-bottom:1px solid #eee }
[data-conversation-content] { flex:1; min-height:0; display:flex; flex-direction:column } #messages { flex:1; min-height:0; overflow:auto; padding:20px; } #messages p { padding:12px; border-radius:8px; background:#f5f5f8 } #composer { flex:none; padding:12px; border-top:1px solid #eee } textarea { display:block; width:100%; min-height:72px; border:1px solid #ddd; border-radius:9px; padding:10px; font:inherit; resize:none } #composer button { margin-top:8px; border:0; border-radius:6px; padding:6px 16px; background:#517bdf; color:#fff }
[data-rightbar-col] { position:relative; min-width:0 } [data-sidebar-right-panel] { position:absolute; top:0; right:0; bottom:0; width:100%; display:flex; flex-direction:column; background:#fafafb; z-index:40; border-left:1px solid #e4e4e8 } [data-sidebar-right-panel="fullscreen"] { width:100vw } .tabbar { padding:14px 20px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #e4e4e8; background:#fff; } .tabbar span { flex:1 } .tabbar button { border:1px solid #ddd; background:transparent; padding:4px 8px; border-radius:6px } iframe { border:0; width:100%; flex:1; min-height:0 } #status { position:absolute; bottom:12px; left:16px; z-index:70; background:#fff; border:1px solid #ddd; border-radius:6px; padding:4px 8px; font-size:11px; max-width:190px }
</style></head><body>
<div id="frame"><aside id="nav"><strong>DeepSeek Harness</strong><p>插件交互验证</p><button id="enter">进入完整视图</button><button id="exit">返回分栏</button><button id="stream">追加流式回复</button><button id="unload">卸载插件</button><p>此页使用插件发布的客户端文件。输入草稿后反复切换，检查内容是否保留。</p></aside>
<main id="chat"><div id="root"><header><div data-conversation-header-leading>完整视图插件验证</div></header><div data-conversation-content data-conversation-session="fixture"><div id="messages"><p>把工作内容展开，我继续在聊天小窗里和你协作。</p><p>聊天、输入框和网页都是原来的实例。切换布局只改变显示位置。</p></div><div id="composer"><textarea aria-label="聊天草稿" id="draft" placeholder="输入测试草稿，不会发送到任何模型"></textarea><button id="send">发送测试消息</button></div></div></div></main>
<div data-rightbar-col><div data-sidebar-right-session="fixture"><section data-sidebar-right-panel="push" data-sidebar-right-open><div class="tabbar"><span>网页预览</span><button data-sidebar-right-mode="fullscreen">进入完整视图</button></div><iframe id="preview" title="状态保持验证网页" srcdoc="<!doctype html><html lang='zh-CN'><body style='margin:0;padding:56px;font-family:system-ui;background:#fafafb;color:#25252a'><span style='font-size:12px;color:#888'>WORKSPACE / LIVE PREVIEW</span><h1 style='font-size:44px;font-weight:500;letter-spacing:-2px;margin:24px 0 12px'>把空间留给工作。</h1><p style='color:#777;font-size:17px'>展开预览，同时保留一扇可以继续对话的小窗。</p><input aria-label='网页表单' placeholder='输入内容，切换后应保留' style='padding:12px;width:280px;border:1px solid #ddd;border-radius:8px;margin-top:40px'><p id='loads'>网页加载次数：1</p></body></html>"></iframe></section></div></div><div data-shell-overlay></div><output id="status">分栏视图</output></div>
<script>
const frame=document.getElementById('frame'), panel=document.querySelector('[data-sidebar-right-panel]'), mode=document.querySelector('[data-sidebar-right-mode]');
function setMode(full){ frame.toggleAttribute('data-rightbar-fullscreen',full); panel.dataset.sidebarRightPanel=full?'fullscreen':'push'; mode.dataset.sidebarRightMode=full?'push':'fullscreen'; mode.textContent=full?'返回分栏视图':'进入完整视图'; }
document.getElementById('enter').onclick=()=>setMode(true); document.getElementById('exit').onclick=()=>setMode(false); mode.onclick=()=>setMode(!frame.hasAttribute('data-rightbar-fullscreen'));
document.getElementById('stream').onclick=()=>document.getElementById('messages').append(Object.assign(document.createElement('p'),{textContent:'流式回复追加，'+new Date().toLocaleTimeString()}));
document.getElementById('send').onclick=()=>{const draft=document.getElementById('draft');document.getElementById('messages').append(Object.assign(document.createElement('p'),{textContent:draft.value||'测试消息'}));draft.value=''};
document.getElementById('unload').onclick=()=>{window.pluginCleanup?.();document.getElementById('status').textContent='插件已卸载'};
window.__ModuleLoader__={load(registration){const module=registration.factory(()=>{throw new Error('unexpected external')});module.apply({effect(factory){window.pluginCleanup=factory()}})}};
new MutationObserver(()=>{const full=frame.hasAttribute('data-dsh-full-view');document.getElementById('status').textContent=full?'完整视图 · 原聊天已浮起':'分栏视图'}).observe(frame,{attributes:true,attributeFilter:['data-dsh-full-view']});
</script><script src="/lib/client.js"></script></body></html>
